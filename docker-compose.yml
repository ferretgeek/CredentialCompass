services:
  credential-compass:
    build: .
    image: credential-compass:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      COMPASS_DEMO: "${COMPASS_DEMO:-true}"
      COMPASS_BIND_HOST: "0.0.0.0"
      COMPASS_PORT: "8788"
      COMPASS_ALLOWED_HOSTS: "${COMPASS_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      COMPASS_TRUSTED_PROXY_IPS: "${COMPASS_TRUSTED_PROXY_IPS:-}"
      COMPASS_ACCESS_TOKEN: "${COMPASS_ACCESS_TOKEN:?set a random value of at least 32 characters}"
      COMPASS_CPA_URL: "${COMPASS_CPA_URL:-https://cliproxyapi.example.com}"
      COMPASS_CPA_KEY: "${COMPASS_CPA_KEY:-}"
      COMPASS_ENABLE_LIVE_PROBE: "${COMPASS_ENABLE_LIVE_PROBE:-false}"
      COMPASS_ALLOW_STATUS_CHANGES: "${COMPASS_ALLOW_STATUS_CHANGES:-false}"
      COMPASS_ALLOW_PRIVATE_HTTP: "${COMPASS_ALLOW_PRIVATE_HTTP:-false}"
      COMPASS_MAX_ACCOUNTS: "${COMPASS_MAX_ACCOUNTS:-1000}"
      COMPASS_CONCURRENCY: "${COMPASS_CONCURRENCY:-4}"
      COMPASS_REQUEST_TIMEOUT: "${COMPASS_REQUEST_TIMEOUT:-15}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.75
