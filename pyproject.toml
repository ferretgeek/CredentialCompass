[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-compass"
version = "1.0.1"
description = "A privacy-first credential health workbench for CLIProxyAPI-managed Codex pools."
readme = "README_EN.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ferretgeek" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ferretgeek/cliproxyapi-credential-check"
Issues = "https://github.com/ferretgeek/cliproxyapi-credential-check/issues"

[project.scripts]
credential-compass = "credential_compass.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credential_compass = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
