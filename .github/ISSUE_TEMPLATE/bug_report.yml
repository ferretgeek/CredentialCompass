name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include real accounts, tokens, credential files, management URLs, deployment hostnames, upstream responses, logs, or screenshots. Security issues belong in Private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible behavior with reserved synthetic data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Credential Compass version
      placeholder: v1.0.0
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed all secrets and identifying information.
          required: true
